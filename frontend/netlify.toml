[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ── SPA routing — all paths go to index.html ─────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Proxy /api to Railway backend ────────────────────────────────────────────
# Replace YOUR_RAILWAY_BACKEND_URL with your actual Railway service URL
# e.g. https://telegram-referral-backend.up.railway.app
[[redirects]]
  from   = "/api/*"
  to     = "https://telegram-referral-platform-production.up.railway.app/api/:splat"
  status = 200
  force  = true

# ── Security headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
